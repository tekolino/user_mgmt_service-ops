{{- if .Values.backend.monitoring.enabled }}

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: backend-servicemonitor
  labels:
    {{- include "user-mgmt-service.labels" . | nindent 4 }}

spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}

  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s

{{- end }}
