apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    {{- include "user-mgmt-service.labels" . | nindent 4 }}
spec:
  selector:
    app: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
  type: ClusterIP
