apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    {{- include "user-mgmt-service.labels" . | nindent 4 }}
 
spec:
  replicas: {{ .Values.postgres.replicaCount }}
 
  strategy:
    type: Recreate
 
  selector:
    matchLabels:
      app: postgres
 
  template:
    metadata:
      labels:
        app: postgres
 
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
 
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
 
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
 
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
 
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
 
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.env.dbName | quote }}
 
            - name: POSTGRES_USER
              value: {{ .Values.backend.env.datasourceUsername | quote }}
 
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: SPRING_DATASOURCE_PASSWORD
 
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
 
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
