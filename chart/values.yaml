global:
  storageClassName: do-block-storage
secret:
  name: app-secret
postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
  service:
    port: 5432
  pvc:
    size: 5Gi
    accessMode: ReadWriteOnce
  env:
    dbName: postgres
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
backend:
  replicaCount: 1
  monitoring:
    enabled: true
  image:
    repository: ghcr.io/thinu-teko/backend
    tag: 08366778dec53c79cc99fbc32fcd8c67d8908d5a
  service:
    port: 8080
  env:
    datasourceUsername: postgres
    ddlAuto: update
    jwtIssuer: Spring
    jwtExpirationMillis: "86400000"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/thinu-teko/frontend
    tag: 08366778dec53c79cc99fbc32fcd8c67d8908d5a
  service:
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
ingress:
  className: nginx
  host: ""
  backendRewriteTarget: /users/$2
