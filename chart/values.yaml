global:
  storageClassName: do-block-storage
secret:
  name: app-secret
postgres:
  managed:
    host: "user-mgmt-postgres-do-user-39968299-0.a.db.ondigitalocean.com"
    port: 25060
backend:
  replicaCount: 1
  monitoring:
    enabled: true
  image:
    repository: ghcr.io/thinu-teko/backend
    tag: 4027b26e7215629d4009becd481837a7b465df02
  service:
    port: 8080
  env:
    ddlAuto: update
    jwtIssuer: Spring
    jwtExpirationMillis: "86400000"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/thinu-teko/frontend
    tag: 4027b26e7215629d4009becd481837a7b465df02
  service:
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
ingress:
  className: nginx
  host: ""
  backendRewriteTarget: /users/$2
