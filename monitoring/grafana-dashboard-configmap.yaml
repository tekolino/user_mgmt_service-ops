apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-user-management-staging
  namespace: monitoring
  labels:
    grafana_dashboard: "1"

data:
  user-management-staging.json: |
    {
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"staging\",uri!=\"/actuator/prometheus\"}[5m]))",
              "legendFormat": "Requests/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request Rate – Staging",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "max": 100,
              "min": 0,
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "100 * sum(rate(http_server_requests_seconds_count{namespace=\"staging\",uri!=\"/actuator/prometheus\",status=~\"4..|5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"staging\",uri!=\"/actuator/prometheus\"}[5m]))",
              "legendFormat": "Error rate",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Error Rate (%) – Staging",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_sum{namespace=\"staging\",uri!=\"/actuator/prometheus\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"staging\",uri!=\"/actuator/prometheus\"}[5m]))",
              "legendFormat": "Average response time",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Average Response Time – Staging",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "user-management",
        "staging",
        "devops"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 2,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "User Management – Staging Monitoring",
      "uid": "user-mgmt-staging"
    }
