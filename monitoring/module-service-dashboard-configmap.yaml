apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-module-service-staging
  namespace: monitoring
  labels:
    grafana_dashboard: "1"

data:
  module-service-staging.json: |
    {
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  },
                  "type": "value"
                }
              ]
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "up{namespace=\"staging\",service=\"module-service\"}",
              "refId": "A"
            }
          ],
          "title": "Module Service Status",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 18,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"staging\",service=\"module-service\",handler!=\"/metrics\"}[5m]))",
              "legendFormat": "Requests/s",
              "refId": "A"
            }
          ],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 3,
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"staging\",service=\"module-service\",handler!=\"/metrics\"}[5m]))",
              "legendFormat": "HTTP {{status}}",
              "refId": "A"
            }
          ],
          "title": "HTTP Status Codes",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 4,
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_sum{namespace=\"staging\",service=\"module-service\",handler!=\"/metrics\"}[5m])) / sum(rate(http_request_duration_seconds_count{namespace=\"staging\",service=\"module-service\",handler!=\"/metrics\"}[5m]))",
              "legendFormat": "Average response time",
              "refId": "A"
            }
          ],
          "title": "Average Response Time",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "id": 5,
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"staging\",pod=~\"module-service-.*\",container=\"module-service\"}[5m]))",
              "legendFormat": "CPU",
              "refId": "A"
            }
          ],
          "title": "CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "id": 6,
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"staging\",pod=~\"module-service-.*\",container=\"module-service\"})",
              "legendFormat": "Memory",
              "refId": "A"
            }
          ],
          "title": "Memory Usage",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "module-service",
        "staging",
        "devops"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 2,
            "label": "Data source",
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Module Service – Staging Monitoring",
      "uid": "module-service-staging"
    }
