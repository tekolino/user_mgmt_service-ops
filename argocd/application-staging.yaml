apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt-service-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tekolino/user_mgmt_service-ops.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
