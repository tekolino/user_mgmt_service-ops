apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tekolino/user_mgmt_service-ops.git
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
